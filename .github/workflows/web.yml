name: Web build (Vercel conditions)

# Reproduces the exact condition the Vercel build runs under - a clean
# install with NO environment variables at all - on every pull request, so a
# regression is caught here rather than on a deploy. The frontend reads
# NEXT_PUBLIC_SUPABASE_* at runtime in the browser; needing them at build
# time is the bug this job exists to prevent from coming back.

# Narrowed for the same reason as tests.yml: a push to a feature branch, the
# pull request on that same sha, and the push to main after merging were three
# billed runs of an identical build. Since 5 Oct (Hassan) only the pull
# request runs it; main is not built again after a merge. See the comment there.
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Confirm no Supabase env vars are present
        run: |
          # Variable NAMES only. Matching whole lines also matched values, so
          # a branch called plan/p6-2-clock-in-supabase (GITHUB_HEAD_REF)
          # failed this check on 26 Sep with no Supabase variable set at all.
          if env | cut -d= -f1 | grep -qi 'SUPABASE'; then
            echo "::error::A SUPABASE variable is set - this job must prove the build works without one."
            exit 1
          fi
          echo "No SUPABASE variables in the environment. Good."

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # The operator gate (plan v2 P1.2): the real write routes, compiled and
      # called with a forged Origin and no session, must answer 401.
      - name: Route tests
        run: npm run test:routes
      - name: Build with zero env vars
        run: npm run build

      - name: Confirm every route prerendered
        # DERIVED FROM THE FILESYSTEM, not a hardcoded list. The list was
        # hardcoded and went stale the moment a page was removed: deleting
        # app/calculator/ failed this step on a route that no longer exists,
        # while the newly added /predictive was never checked at all. A list
        # that has to be edited by hand is a list that is wrong.
        run: |
          set -e
          fail=0
          n=0
          # every app/<route>/page.tsx, plus the root app/page.tsx
          routes=$(cd app && find . -name page.tsx | sed 's|^\./||; s|/page.tsx$||; s|^page.tsx$||' | sort)
          for r in $routes; do
            path="./.next/server/app/${r}.html"
            [ -z "$r" ] && path="./.next/server/app/index.html"
            n=$((n+1))
            if [ ! -f "$path" ]; then
              echo "::error::route /${r} did not prerender ($path missing)"
              fail=1
            fi
          done
          if [ ! -f ./.next/server/app/index.html ]; then
            echo "::error::route / did not prerender"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "All $n routes prerendered."
