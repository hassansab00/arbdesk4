name: Model Forecast

# Applies the stored per-city coefficients to the NWS forecast conditions n8n
# P1.4 writes, producing AD4's own prediction of each day's maximum.
#
# Separate from Weather Model on purpose. Fitting is weekly - the relationship
# is seasonal and a day of new observations cannot move it. Predicting has to
# happen whenever new forecast conditions arrive, which is every few hours.
# Refitting on that cadence would burn minutes re-deriving the same numbers.
#
# 15 minutes before the probability pipeline, so a fresh prediction is in the
# table by the time anything prices against it.
on:
  schedule:
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Predict and report without writing'
        type: boolean
        required: false
        default: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: python scripts/weather_model.py --predict-only ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
