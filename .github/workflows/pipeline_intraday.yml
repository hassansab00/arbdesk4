name: Intraday Pipeline (model, probabilities, edges)

# ONE RUNNER INSTEAD OF THREE, six times a day.
#
# These were three separate workflows firing fifteen minutes apart -
# model_forecast at :15, probabilities at :30 - which is a
# chain pretending not to be one. Each paid its own checkout, its own
# setup-python and its own pip install before doing 16 to 41 seconds of
# actual work, and GitHub bills every run rounded UP to a whole minute. Three
# runs of mostly-setup cost three billed minutes; one run doing all four
# scripts costs two.
#
# It is also more correct. The gaps between them were a guess that the
# previous stage had finished - nothing checked. Now each stage genuinely runs
# after the edges it reads, because it is the next step in the same job.
#
# Each step carries `if: !cancelled()` so a failure does NOT skip the rest:
# that preserves exactly what the separate workflows gave you, where a broken
# probability run did not stop the next stage running on the previous one. The
# job still fails, and the step that failed is named.

on:
  # EVERY SIX HOURS FROM 4 OCT (plan v2 P6.1, 20261004170000): the clock
  # (public.clock_tick) dispatches this at 02:36, 08:36, 14:36 and 20:36 UTC.
  # The Pro plan's 3,000 minutes a month cover CI as well, and this job bills
  # about 4 a run (3.95, 1-4 Oct). The hourly tick prices every checkpoint and
  # re-prices same-day ladders itself, so the checkpoint record does not
  # depend on this cadence. The day-ahead hit record does (its call is the
  # last band_probabilities pricing before local midnight, written only here),
  # and these hours put that call 1.64 h before midnight on average over the 48
  # cities, against 2.01 h on the six runs before (the migration has the
  # arithmetic). The board, the edges and the paper cycle stay inside their
  # freshness limits (decisions 8 h, edges 12 h).
  #
  # (Before that:) NO GITHUB CRON: n8n's "AD4 P6.1 - Clock" dispatches this at 00:36, 04:36,
  # 08:36, 12:36, 16:36 and 20:36 UTC. On 24 Sep GitHub's cron started none of
  # the 00:15, 08:15 and 16:15 runs - three of the five slots that had passed
  # by 19:00Z. The cadence below is unchanged; only
  # the minute moves, from :15 to :36, still after P0.2's discovery at :20.
  # The CLOCK table in n8n/P6.1_clock.template.json is what the budget counts.
  #
  # (The cadence, as it was set:)
    # EVERY FOUR HOURS, up from every six. Merging three workflows into this
    # one freed enough of the monthly allowance to buy freshness with it
    # rather than bank it: probabilities and edges are now at most
    # four hours old instead of six, and the whole schedule still costs about
    # half what the nine separate workflows did.
    #
    # Offset past the hour so each cycle lands after P0.2's market
    # discovery rather than racing it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Model forecast: compute but do not write (true/false)'
        required: false
        default: 'false'

concurrency:
  # A cycle still running when the next one fires means the desk is behind,
  # not that it needs two copies of itself competing for the same rows.
  group: pipeline-intraday
  cancel-in-progress: false

env:
  PYTHONPATH: scripts
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      # 1. The model's own forecast, so probabilities have a second opinion
      #    to price against rather than only the ingested one.
      - name: Model forecast
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python scripts/weather_model.py --predict-only ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 2. Band probabilities from forecast + measured skill + calibration.
      - name: Band probabilities
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: python scripts/probability_engine.py

      # 3. Edges. Python rather than the Postgres compute_edges RPC that the
      #    n8n spec (§7.6) describes: the ladder-walk and fee-curve math
      #    already lives in cost_model.py/edge_engine.py, and a second
      #    implementation in PL/pgSQL would be two things to keep in sync.
      #    See docs/architecture_deviations.md.
      - name: Edges
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: python scripts/edge_engine.py

      - name: Preserve predictive and synthesis evidence
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 3
        run: python scripts/research_capture.py
        env:
          RESEARCH_CAPTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # EXITS FIRST (plan v2 P5.0 item 2). Every exit the desk ever queued -
      # 5 of 5, 17-19 Sep - expired unfilled: this step ran after the fill, so
      # its order waited four hours for the next worker. Evaluated here, the
      # exit is queued before "Fill queued paper orders" and filled in this
      # same run. It is also before the signals, so the time it takes is not
      # taken from a new BUY's five minutes. An exit order lives 30 minutes
      # (20260924060000_exits_live_thirty_minutes.sql).
      - name: Paper exit policies
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 2
        run: python scripts/paper_exits.py

      # THE STEP THAT WAS MISSING. paper_plans.py below reads signals fired in
      # the last fifteen minutes; nothing wrote them, so it proposed nothing
      # and every assisted desk looked dead. This runs the enabled strategies
      # against the board the edge engine just priced. It must come BEFORE the
      # proposals step, which is the whole reason the chain is one job.
      - name: Strategy signals
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 3
        run: python scripts/signal_engine.py

      - name: Paper strategy proposals
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 3
        run: python scripts/paper_plans.py

      # IMMEDIATELY after the proposals, and that ordering is load-bearing.
      #
      # An automatic account's plan is queued as an order inside
      # publish_paper_plan, and queue_plan gives that order the PLAN's
      # expires_at - five minutes from creation, deliberately, because a price
      # quoted five minutes ago is a lie. paper_worker.cycle() begins by
      # calling expire_paper_commands(), which kills every order past its
      # deadline before it claims any.
      #
      # This step used to run third of the three, behind settlement and exits
      # at two minutes of timeout each, with paper_plans itself allowed 90
      # seconds of proposal budget before that. Worst case the worker reached
      # an order five and a half minutes old and expired the very order the
      # run had just created - the automatic desk would queue, reserve the
      # cash, release it, and report nothing filled.
      #
      # Settlement does not need to precede a fill: it pays out resolutions,
      # and reads a strictly better picture after this step than before it.
      # Exits DO need to precede it, which is why they run above.
      - name: Fill queued paper orders
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 3
        run: python scripts/paper_worker.py

      # THE EVIDENCE CHAIN CANNOT DEPEND ON THE DAILY CRON, because that cron
      # is not reliable. GitHub delays and drops scheduled workflows under
      # load: the last SCHEDULED daily run was 15 Sep at 09:06 UTC, five hours
      # after its 04:00 slot, and the 16 Sep one had still not fired by 07:50.
      # The sweep only ever ran at full budget there, so the day the budget
      # was raised to 900s was a day it never got to use.
      #
      # This job runs six times a day and has been reliable, so the sweep gets
      # a real budget here too: ~240 bands a run against the ~1/second the two
      # venue calls cost, six runs a day, instead of one daily run that may
      # not happen. It sits after the fill step, so a longer sweep delays no
      # order.
      - name: Venue-confirmed paper settlement
        if: ${{ !cancelled() && vars.PAPER_TRADES_ENABLED != 'false' }}
        timeout-minutes: 6
        run: python scripts/paper_settlement.py --holdings-only --budget-seconds 60 --max-evidence 100

      # LADDERS WHOSE DAY HAS ENDED, CONFIRMED AND BANKED IN THIS RUN (plan
      # v2.2 P4.7, finished 30 Sep; handoff F1). /predictive's hit/miss record
      # is fact_band_outcome, which only pipeline_daily (04:36Z) wrote: a US day
      # ends 04:00-07:00Z, so it waited a full day (median 24.0 h from 25 Sep),
      # although the venue closed US ladders a median 1.2-1.4 h after the day
      # ended. The tick asks the queue every hour inside its own minute; this
      # asks again with a longer budget (the queue's backoff skips what the
      # tick just asked), then banks what is now confirmed - the same
      # bank_bands(), whole ladder or nothing - so the refresh below shows it.
      # Not gated on PAPER_TRADES_ENABLED: this is the outcome record, not
      # trading. Minutes: measured on the first real runs, see MEASURED_MINUTES.
      - name: Venue confirmations, ladder by ladder (P4.7 queue)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python scripts/confirm_queue.py --budget-seconds 60 --days-back 3
      - name: Bank the ladders just confirmed (P4.7, bands only)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python scripts/databank.py --bands-only --days 3 --proof-days 3

      # THE PAGES READ STORED ROWS (plan v2 P6.5): refresh them now that this
      # run has written, rather than at the next :12 / :42 of pg_cron.
      # CONCURRENTLY, so a page open during the refresh keeps reading.
      - name: Refresh the stored page rows
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from common import rpc
          print("page cache refreshed (ms):", rpc("refresh_page_cache"))
          PY
