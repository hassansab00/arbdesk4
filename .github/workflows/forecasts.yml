name: Forecasts (Open-Meteo Previous Runs)
# Each resumable link is bounded to 25 job minutes, including setup.
# The wrapper invokes scripts/ingest_forecasts.py (provenance source).
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date YYYY-MM-DD (blank = last 10 days)'
        required: false
      end:
        description: 'End date YYYY-MM-DD'
        required: false
      auto_continue:
        description: 'Continue within the declared chain budget'
        default: 'true'
      depth:
        description: 'Internal continuation depth'
        default: '0'
      chain_budget_minutes:
        description: 'Whole-chain job-minute ceiling, 25 to 300'
        default: '75'
permissions:
  contents: read
  actions: write
concurrency:
  group: forecasts-backfill
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt
      - name: Bounded resumable backfill
        run: python scripts/forecast_backfill_job.py
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKFILL_START: ${{ inputs.start }}
          BACKFILL_END: ${{ inputs.end }}
          BACKFILL_DEPTH: ${{ inputs.depth }}
          BACKFILL_AUTO: ${{ inputs.auto_continue }}
          BACKFILL_BUDGET: ${{ inputs.chain_budget_minutes }}
