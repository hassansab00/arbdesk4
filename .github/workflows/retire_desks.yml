name: Retire Paper Desks (one-off)

# Plan v2 step P0.3: retire every existing paper desk, keeping all of its
# history. WXPredict build P.2 adds a targeted mode (`strategies`): only the
# listed strategies' desks. Manual only - there is no schedule, and there
# never should be.
#
# EXPORT, VERIFY, PUSH, THEN RETIRE - in that order, and never fused.
# Retirement deletes nothing (every row stays in Postgres), but this is the
# moment the desks' whole record is copied into the repository, and the copy
# counts only once it is on origin. tools/retire_desks.py re-checks that
# itself before it retires anything, so the guarantee does not rest on this
# step ordering alone.
#
# It needs the service key, which lives only in this repo's secrets - which is
# why it is a workflow and not something run from a laptop or a session.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RETIRE to export every desk and then retire them (all, or only the listed strategies)'
        required: true
        default: ''
      # WXPredict build P.2 (D5, Hassan 5 Oct): retire only these strategies'
      # desks, each already switched off; every other desk and every strategy
      # is left as it is. Empty: today's whole-desk retirement (P0.3).
      strategies:
        description: 'Optional: comma-separated strategy ids whose desks to retire (each must be switched off)'
        required: false
        default: ''
      reason:
        description: 'Optional: the reason recorded on each retired desk'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: retire-desks
  cancel-in-progress: false

jobs:
  retire:
    if: github.event.inputs.confirm == 'RETIRE' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      - name: Export every desk and verify the files against the live tables
        run: python tools/retire_desks.py export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit and push the export
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/paper_desks
          if git diff --staged --quiet; then
            echo "the export is already committed"
          else
            git commit -m "Paper desks: every desk's record before retirement (plan v2 P0.3) [skip ci]"
          fi
          # A LOOP THAT RUNS OUT IS NOT A PUSH THAT WORKED - the same guard as
          # paper_trade_log.yml.
          pushed=0
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push failed, retrying"; sleep $((2 ** i))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push the export after four attempts; nothing was retired"
            exit 1
          fi

      # With `strategies`: only those desks (tools/retire_desks.py refuses a
      # listed strategy that is switched on, and touches no strategy). Without:
      # every desk, then s1-s9 switched off. The inputs reach the tool through
      # the environment, never through the shell's text.
      - name: Retire the desks, with the reason on record
        run: |
          set -- retire
          if [ -n "$STRATEGIES" ]; then set -- "$@" --strategies "$STRATEGIES"; fi
          if [ -n "$REASON" ]; then set -- "$@" --reason "$REASON"; fi
          python tools/retire_desks.py "$@"
        env:
          STRATEGIES: ${{ github.event.inputs.strategies }}
          REASON: ${{ github.event.inputs.reason }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
