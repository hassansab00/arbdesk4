name: Archive Observations

# Moves cold rows out of Postgres into a GitHub Release, then prunes them.
# Three tables: trades_observed, weather_observations, weather_forecasts.
# The same data as gzipped CSV is roughly fifty times smaller. That is the
# whole difference between staying inside a free tier and paying for one.
#
# It refuses to prune unless the upload verifies by reading back the same row
# count, and each prune_* function independently refuses unless the summary
# that survives the delete already covers the range. Both guards have to pass.
#
#
# THE SCHEDULED RUN COMMITS. IT DID NOT, AND THAT MADE THE WHOLE JOB A NO-OP.
#
# The flag used to be written `${{ github.event.inputs.commit == 'true' &&
# '--commit' || '' }}`. On a `schedule` event github.event.inputs is null, so
# that expression is empty every time and the monthly run was a permanent dry
# run - it would print what it WOULD delete, delete nothing, and exit green.
# Nobody would ever have seen it fail, because it never failed; it just never
# did anything. (It had also never actually fired: all nine runs in its
# history were workflow_dispatch, every one of them clicked by hand.)
#
# So the default is inverted. A cron fire commits. A manual run commits unless
# the box is UNticked, which is the dry run you want when checking a change.
# The prune is already bound to a verified row count on both sides, so an
# automatic commit cannot delete more than was archived.
#
# WEEKLY, NOT MONTHLY. Monthly was for a database with room. This one runs at
# 436 MB of 500 with research_captures adding ~15 MB a day, and a month is
# long enough to cross the ceiling twice over. Each run rewrites one release
# asset per table, so the cost of running it more often is a few megabytes of
# release storage.
on:
  # NO GITHUB CRON (25 Sep): n8n's "AD4 P6.1 - Clock" dispatches this at 02:36 UTC daily, with inputs commit=true and table=all.
  # GitHub's cron started nothing on this repo from 20:04Z on 24 Sep for 12 h;
  # every scheduled workflow is on the CLOCK table in n8n/P6.1_clock.template.json.
  #
  # (Why daily:) DAILY, not weekly. Weekly was right when the archive covered three
    # tables with months of history and a ninety-day window. research_captures
    # grows about 29 MB a day - 25,808 rows on 15 Sep, 24,510 on the 16th - on
    # a 500 MB tier, so a week between runs is 200 MB, which is more headroom
    # than the tier has. The other three find nothing most days and cost a
    # query that returns zero rows.
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Override every table window (blank = each table keeps its own: 90 days, 2 for research)'
        required: false
        default: ''
      table:
        description: 'Which archive to run'
        type: choice
        options: ['all', 'books', 'edges', 'forecasts', 'observations', 'research', 'resolution', 'trades']
        default: 'all'
      commit:
        description: 'Upload and prune (UNtick for a dry run)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write                # release assets

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      # THE BACK-HISTORY, BROUGHT HOME.
      #
      # 658,993 rows were archived before the repository held any of them -
      # they went to Releases, which are attached to a repo and not in it, so
      # the only copy of thirteen months of observations needed the API and a
      # token to read. This copies every existing asset into data/archive so
      # it sits in the tree beside everything written from now on.
      #
      # It runs EVERY time rather than behind a flag: it is idempotent, it
      # skips any asset already on disk at the right size, and running it
      # unconditionally means the repo heals itself if a file is ever removed
      # or a run dies half way. The cost is seven release lookups.
      - name: Pull existing Release archives into the repository
        run: PYTHONPATH=scripts python scripts/archive_observations.py --pull-releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # EVERY ARCHIVED VERDICT STAYS READABLE (plan v2 P4.5). A pruned proof
      # used to take the venue's answer with it: v_venue_band_resolution read
      # the evidence table, and on 24 Sep 2,948 banked outcomes had dropped out
      # of the verified record that way. resolution_verdicts keeps each verdict
      # without its payload and a trigger fills it from every new proof; this
      # puts back the ones archived before the trigger existed. Idempotent,
      # append-only, and before the prune, so it never waits on one.
      - name: Keep every archived verdict readable
        run: PYTHONPATH=scripts python scripts/restore_verdicts.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # THE ORDER IS THE SAFETY. Export writes files into data/archive and
      # deletes nothing; the commit pushes them; only then does the prune run,
      # and it re-reads each committed file and asks git whether it is in HEAD
      # before it lets the database drop a single row.
      #
      # Run as one step - which is how it ran until 21 Sep - a job that dies
      # between the delete and the commit takes the only record of where the
      # rows went with it. That is not hypothetical: the index was written
      # onto the runner and destroyed with the runner six runs in a row, while
      # the Releases held 623,768 rows nothing in the repository could name.
      - name: Export cold rows into the repository
        run: |
          PYTHONPATH=scripts python scripts/archive_observations.py \
            ${{ github.event.inputs.keep_days && format('--keep-days {0}', github.event.inputs.keep_days) || '' }} \
            --table ${{ github.event.inputs.table || 'all' }} \
            --export-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `!cancelled()` ON THIS STEP AND THE PRUNE, because an archive is seven
      # independent datasets and one refusal must not strand the other six.
      # On 23 Sep research, resolution and trades refused their exports, the
      # step failed, and the default `success()` skipped this commit and the
      # prune for every dataset - while books, edges, forecasts and
      # observations had exported and verified cleanly. 138,152 rows ended up
      # in the repository and still in the database, at 124% of the tier.
      #
      # The gate added no safety. Every prune decides for its own dataset: it
      # needs a pending record (written only after THAT dataset's export,
      # dry-run count and read-back all passed), a file that re-counts to the
      # same rows, and that file in HEAD. A dataset whose export refused has no
      # record and prunes nothing. The export step's failure still fails the
      # job, so a refusal stays red until it is fixed.
      - name: Commit the data BEFORE anything is deleted
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add <dir>` is FATAL under `bash -e` when the directory does
          # not exist - `fatal: pathspec 'data/archive' did not match any
          # files`, exit 128 - and data/archive does not exist until something
          # writes into it. Run 15 died there before the prune, on a step whose
          # whole job is "commit whatever was produced".
          #
          # mkdir -p, not a git flag: `git add --ignore-unmatch` is not a
          # thing (that is `git rm`), and it exits 129 telling you so. An
          # existing empty directory adds nothing and exits 0, which is the
          # behaviour wanted on a run that produced no files. Checked both
          # ways against a real repository rather than assumed.
          mkdir -p data/archive
          git add data/archive web/public/archive/index.json
          if git diff --staged --quiet; then
            echo "nothing exported this run"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROWS=$(python3 -c "import json;d=json.load(open('web/public/archive/index.json'));print(sum(x['rows_archived'] for x in d['datasets'].values()))")
          git commit -m "Archive: ${ROWS} rows held in data/archive [skip ci]"
          # A LOOP THAT RUNS OUT IS NOT A PUSH THAT WORKED (plan v2 P1.5).
          # This loop used to end after four failures with the status of its
          # trailing `git pull --rebase` - success - so a total push failure
          # passed, and the prune ran against files that existed only on this
          # runner. The same guard as paper_trade_log.yml.
          pushed=0
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push failed, retrying"; sleep $((2 ** i))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push after four attempts"
            exit 1
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      # ONLY AFTER A CONFIRMED PUSH (plan v2 P1.5). This used to say that a
      # failed push left the files out of HEAD so the prune would refuse by
      # itself - but a failed push leaves them IN local HEAD, which is what
      # is_committed() checked. Two guards now, either sufficient: this step
      # runs only when the commit step reported ok=1 (pushed, or nothing new
      # to push), and is_committed() compares each file with the blob on
      # origin, fetched fresh.
      - name: Prune, now that the rows are in the repository
        if: ${{ !cancelled() && steps.commit.outputs.ok == '1' && (github.event_name != 'workflow_dispatch' || github.event.inputs.commit == 'true') }}
        run: |
          PYTHONPATH=scripts python scripts/archive_observations.py \
            --table ${{ github.event.inputs.table || 'all' }} \
            --prune-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AN ARCHIVE NOTHING CAN READ IS INDISTINGUISHABLE FROM A DELETION, and
      # this step is the half of that sentence which never shipped.
      #
      # The script writes web/public/archive/index.json after every prune, and
      # nothing committed it - so it was written onto the runner and destroyed
      # with the runner, every single run. The only copy in the repository was
      # one made by hand on 19 Sep listing research alone, while the Releases
      # held 623,768 rows across four datasets. /api/archive reads that index
      # to find an asset, so half a million archived rows were unreachable
      # from the platform that archived them.
      #
      # `if: always()` because the datasets are archived in sequence and any
      # one of them can refuse - on 20 Sep resolution failed its count check
      # after forecasts, observations and research had already uploaded and
      # pruned. Committing only on success would drop the index for exactly
      # the runs that changed it.
      - name: Commit the archive index
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add <dir>` is FATAL under `bash -e` when the directory does
          # not exist - `fatal: pathspec 'data/archive' did not match any
          # files`, exit 128 - and data/archive does not exist until something
          # writes into it. Run 15 died there before the prune, on a step whose
          # whole job is "commit whatever was produced".
          #
          # mkdir -p, not a git flag: `git add --ignore-unmatch` is not a
          # thing (that is `git rm`), and it exits 129 telling you so. An
          # existing empty directory adds nothing and exits 0, which is the
          # behaviour wanted on a run that produced no files. Checked both
          # ways against a real repository rather than assumed.
          mkdir -p data/archive
          git add data/archive web/public/archive/index.json
          if git diff --staged --quiet; then
            echo "index unchanged - nothing was archived this run"
            exit 0
          fi
          ROWS=$(python3 -c "import json;d=json.load(open('web/public/archive/index.json'));print(sum(x['rows_archived'] for x in d['datasets'].values()))")
          git commit -m "Archive index: ${ROWS} rows retrievable [skip ci]"
          # A LOOP THAT RUNS OUT IS NOT A PUSH THAT WORKED (plan v2 P1.5).
          # This loop used to end after four failures with the status of its
          # trailing `git pull --rebase` - success - so a total push failure
          # passed, and the prune ran against files that existed only on this
          # runner. The same guard as paper_trade_log.yml.
          pushed=0
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push failed, retrying"; sleep $((2 ** i))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push after four attempts"
            exit 1
          fi

      # THE NIGHTLY MIRROR (plan v2.1 P1.7). The steps above export only what
      # the prune is about to remove. Every price, every settled outcome and
      # every learned parameter the platform keeps lived in Postgres alone;
      # this copies each one into data/mirror once its day has ended. It
      # DELETES NOTHING, so it runs whatever happened above: a failed prune is
      # no reason to leave the record uncopied.
      - name: Mirror the proprietary record into the repository
        if: always()
        run: PYTHONPATH=scripts python scripts/mirror_to_repo.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # `if: always()`: a table that failed must not strand the ones that were
      # written and verified - the manifest is saved after every table, so
      # what is on disk is exactly what it records.
      - name: Commit the mirror
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/mirror
          git add data/mirror
          if git diff --staged --quiet; then
            echo "mirror unchanged - nothing new to copy"
            exit 0
          fi
          FILES=$(git diff --staged --name-only | grep -c '\.csv\.gz$' || true)
          git commit -m "Mirror: ${FILES} files into data/mirror [skip ci]"
          pushed=0
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push failed, retrying"; sleep $((2 ** i))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push the mirror after four attempts"
            exit 1
          fi
