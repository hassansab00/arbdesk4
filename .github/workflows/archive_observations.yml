name: Archive Observations

# Moves cold weather observations out of Postgres and into a GitHub Release,
# then prunes them. weather_observations is ~98% of the database at 272 bytes a
# row; the same data as gzipped CSV is about 50x smaller. That is the whole
# difference between staying inside a free tier and paying for one.
#
# Monthly, not weekly: the point is to stay under a ceiling, not to keep the
# table minimal, and every run rewrites a release asset.
#
# It refuses to prune unless the upload verifies by reading back the same row
# count, and prune_observations() independently refuses unless the feature
# cache already covers the range. Both guards have to pass.
on:
  schedule:
    - cron: '0 3 1 * *'          # 03:00 UTC on the 1st
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Days of raw rows to leave in Postgres'
        required: false
        default: '180'
      table:
        description: 'Which archive to run'
        type: choice
        options: ['both', 'observations', 'forecasts']
        default: 'both'
      commit:
        description: 'Actually upload and prune (unticked = dry run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write                # release assets

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt
      - run: |
          PYTHONPATH=scripts python scripts/archive_observations.py \
            --keep-days ${{ github.event.inputs.keep_days || '180' }} \
            --table ${{ github.event.inputs.table || 'both' }} \
            ${{ github.event.inputs.commit == 'true' && '--commit' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
