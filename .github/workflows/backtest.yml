name: Backtest

# A backtest is something you ASK for. This used to poll every 10 minutes -
# 4,320 runs a month, and GitHub bills a minimum of one minute per job whether
# it finds work or not, so it was ~6,500 minutes of a 2,000-minute allowance
# spent almost entirely on discovering there was nothing to do.
#
# Three ways in now, none of them a poll:
#
#   Run workflow            here, after queuing one in AD4 -> Backtest
#   repository_dispatch     instant, for anything holding a token:
#     curl -X POST -H "Authorization: Bearer $GH_PAT" \
#          -H "Accept: application/vnd.github+json" \
#          https://api.github.com/repos/OWNER/REPO/dispatches \
#          -d '{"event_type":"backtest-queued"}'
#   the daily sweep        a safety net, so a queued run is never forgotten -
#                          now the last step of pipeline_daily.yml, on a runner
#                          that job has already paid for, rather than its own
#                          cron here
#
# 4,320 runs a month becomes 0 of its own.
on:
  repository_dispatch:
    types: [backtest-queued]
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=scripts python scripts/backtest/runner.py ${{ github.event.inputs.run_id }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
