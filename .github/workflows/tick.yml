name: Tick (hourly checkpoints)

# THE HOURLY TICK (plan v2 P6.1), first stage: the checkpoint writer (P4.2).
# scripts/tick.py writes one prediction_checkpoints row per city whose
# checkpoint fell in the last 75 minutes, on the city's own clock.
#
# HOURLY AT :36 (started by n8n's clock, see `on:`), NOW THAT IT HAS BEEN TIMED. GitHub bills each job in whole
# minutes, so the tick is worth an hourly schedule only inside 60 s: at 61 s
# it costs two, 1,440 a month on its own. Dispatched on 24 Sep it took 35 s
# cold and 21 s warm; tick.py stops itself at 45 s. It is paid for by the
# engine speed-up (intraday 6.2 -> 2.0 billed minutes a run), so the minute
# budget in tests/test_github_actions.py is unchanged. Intraday keeps pricing
# every four hours until its stages move into the tick.
#
# Built for the minute: one job, no matrix, a shallow sparse checkout of the
# paths it needs, and a cached virtualenv so a warm run installs nothing.

on:
  # NO GITHUB CRON: n8n's "AD4 P6.1 - Clock" dispatches this every hour at
  # :36 UTC. GitHub's cron ran this job once in its first seven hourly slots
  # (11:35-17:35Z, 24 Sep); n8n's schedules fired on the minute all week.
  # tests/test_github_actions.py counts the clock's runs against the budget
  # from the CLOCK table in n8n/P6.1_clock.template.json.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Price and print, write nothing (true/false)'
        required: false
        default: 'false'
      at:
        description: 'Rehearse as if it were this UTC time (ISO, blank = now)'
        required: false
        default: ''

concurrency:
  group: tick
  cancel-in-progress: false

env:
  PYTHONPATH: scripts
  PREDICTIVE_PRIMARY: wxrd3-horizons-v1
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  tick:
    runs-on: ubuntu-latest
    # 5 minutes from 9 Oct (was 3). The longest this job can honestly run:
    # the deadline below (110 s, starting 2-4 s in), then the NWS steps, which
    # carry no deadline of their own, then the trade prints' 120 s backstop
    # for a hung request, then the post steps (2-6 s). That is about 240 s
    # before the NWS steps; 300 leaves them a minute (Codex on #353).
    # 8 from 13 Oct: WXPredict's shadow, the last step, has 3 minutes of its
    # own (a cold virtualenv installs numpy, pandas, scipy and lightgbm).
    # P6.1, 19 Oct: retain the collectors' backstops and shadow timeout with
    # the longer bounded checkpoint allowance. No dispatch cadence change.
    # P6.1: preserve the existing collector/shadow backstops with the larger
    # bounded checkpoint finalization allowance. Dispatch cadence is unchanged.
    timeout-minutes: 10
    steps:
      # THE DEADLINE. Every step after the fixed ones may use only the time
      # left before it: 220 s after this step. Until 9 Oct it was 48 s, to
      # keep the job inside one billed minute (measured 27 Sep: this step
      # starts 2-4 s into the job, the post steps add 2-6 s). The repository
      # is public from 9 Oct and standard runners are free for it, so the
      # deadline follows the work: tick.py's BUDGET_S (210 s) gives the
      # model-only twins the time they lacked. tick.py reads it too
      # (tick.budget): a slow checkout or a cold install comes out of the
      # tick's allowance instead of running past the deadline. The 45 s
      # minimum still protects checkpoint capture after a slow setup.
      - name: Deadline
        run: echo "TICK_DEADLINE=$(( $(date +%s) + 220 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # data/archive/forecasts: regime's history reaches below the
          # database's keep there (scripts/weather_history.py, P1.6 phase 2).
          sparse-checkout: |
            scripts
            requirements.runtime.txt
            data/models/remaining_day/current.json
            data/models/remaining_day/challenger_rd3.json
            data/models/remaining_day/late_hours.json
            data/archive/forecasts
            requirements.wxpredict.txt
            tools/wxpredict
            data/models/wxrd
            data/mirror/cities
            data/mirror/manifest.json
            data/mirror/live_capture
            data/training/wxpredict/station_daily.csv.gz
            data/training/wxpredict/station_daily_nightly
            data/training/previous_runs/best_match_daily.csv.gz
            data/training/previous_runs/models_daily.csv.gz
          sparse-checkout-cone-mode: false
      - id: py
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: tick-primary-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.wxpredict.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.wxpredict.txt
      - name: Trade prints, started beside the other steps (replaces n8n P0.4)
        # IN THE BACKGROUND, NOT LAST (28 Sep). Run last, the trade prints got
        # only what the other steps left before TICK_DEADLINE, and on 28 Sep
        # that was nothing in 9 of 27 ticks and under 5 s in 6 more (tick.py
        # 18-33 s, NWS readings 6-9 s, confirmations up to 20 s): 11 of 19 runs
        # read no trade and the cycle stood at its 04:36Z mark all day. The
        # step waits on the network, not the CPU, so it runs beside the others
        # from here with up to 60 s of its own (30 until 9 Oct, Wave 2.D),
        # still ending before the same deadline (ingest_trades.py budget()). The last
        # step collects its log and exit code. set +e because the runner's
        # bash -e would end the subshell before it wrote the code down; the
        # subshell's own output goes to /dev/null so this step does not wait
        # on a pipe it holds open.
        # Not on a rehearsal: dry_run writes nothing.
        id: trades
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          (
            set +e
            .venv/bin/python scripts/ingest_trades.py --budget 60 > "$RUNNER_TEMP/trades.log" 2>&1
            echo $? > "$RUNNER_TEMP/trades.rc"
          ) < /dev/null > /dev/null 2>&1 &
      - name: Venue confirmations, started beside the other steps (P4.7)
        # IN THE BACKGROUND, NOT AFTER THE OTHERS (30 Sep). Run after tick.py and
        # the NWS steps, it got what they left before TICK_DEADLINE: the first
        # tick after #290 (10:36Z 30 Sep) had 0.0 s and skipped, as 10 ticks had
        # in the three days before. It waits on the venue and PostgREST, not
        # the CPU, so it runs beside the checkpoints with its budget still cut
        # from the same deadline (confirm_recent.budget). `timeout` is the
        # backstop; the last step collects its log. Not on a rehearsal:
        # dry_run writes nothing.
        # P6.1/P4.7, 22 Oct: 180 s covers the bounded 120 s sweep, last
        # ladder, bank reserve and logging. The existing tick deadline can
        # still shorten the sweep. Dispatch cadence and job timeout stay put.
        id: confirm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          date +%s > "$RUNNER_TEMP/confirm.start"
          (
            set +e
            timeout 180 .venv/bin/python scripts/confirm_recent.py > "$RUNNER_TEMP/confirm.log" 2>&1
            echo $? > "$RUNNER_TEMP/confirm.rc.tmp" && mv "$RUNNER_TEMP/confirm.rc.tmp" "$RUNNER_TEMP/confirm.rc"
          ) < /dev/null > /dev/null 2>&1 &
      - name: The live record, started beside the other steps (WXPredict WP3)
        # Every live input as it arrives, with the time it arrived
        # (scripts/live_capture.py): every open bucket's book, the hourly
        # `_previous_day1` forecast, and the station reports of the tick's own
        # IEM read, which tick.py leaves in LIVE_CAPTURE_IEM (one IEM request,
        # as before). It waits on the network, not the CPU, so it runs beside
        # the checkpoints; its budget (95 s) ends before TICK_DEADLINE, and
        # `timeout` is the backstop. A run the backstop ends is logged by its
        # collecting step. Off or manual on the Workflows page
        # (P2.12_live_capture) stores nothing. Not on a rehearsal.
        id: capture
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          LIVE_CAPTURE_IEM: ${{ runner.temp }}/iem_answer.txt
        run: |
          date +%s > "$RUNNER_TEMP/capture.start"
          (
            set +e
            timeout 105 .venv/bin/python scripts/live_capture.py > "$RUNNER_TEMP/capture.log" 2>&1
            echo $? > "$RUNNER_TEMP/capture.rc.tmp" && mv "$RUNNER_TEMP/capture.rc.tmp" "$RUNNER_TEMP/capture.rc"
          ) < /dev/null > /dev/null 2>&1 &
      - name: Checkpoints
        # Inputs reach the script through the environment, never the shell
        # line, and tick.py parses --at as a timestamp or refuses it.
        # LIVE_CAPTURE_IEM: where it leaves its IEM answer for the live record.
        env:
          TICK_DRY_RUN: ${{ github.event.inputs.dry_run }}
          TICK_AT: ${{ github.event.inputs.at }}
          LIVE_CAPTURE_IEM: ${{ runner.temp }}/iem_answer.txt
        run: .venv/bin/python scripts/tick.py
      - name: NWS forecasts (replaces n8n P1.3 and P1.4)
        # Runs in the ticks of 03, 09, 15 and 21 UTC, the hours n8n ran them;
        # every other tick it returns at once (ingest_nws.py HOURS_UTC).
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: .venv/bin/python scripts/ingest_nws.py
      - name: NWS station readings and alerts (replaces n8n P1.2)
        # Runs in the ticks of even UTC hours, never beside the NWS forecast
        # step (03/09/15/21); every other tick returns at once
        # (ingest_nws_monitor.py HOURS_UTC).
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: .venv/bin/python scripts/ingest_nws_monitor.py
      - name: Venue confirmations, collected (P4.7)
        # Waits for the run started above (its budget ends before
        # TICK_DEADLINE). It never fails the job: a failure is in its own log
        # row (P4.7_confirm_recent) and in the crash row common.py writes.
        # A run its timeout ended (exit 124) writes neither, so this step
        # writes its row, attention with the exit code (Wave 2.C, 9 Oct: six
        # such hours in 72 h were silent gaps). It waits until the run's own
        # 180 s backstop has passed, counted from when the run started, so a
        # hung run's 124 is always seen (Codex on #355: a fixed 45 s from
        # here could end before the backstop when the steps above are quick).
        if: ${{ !cancelled() && steps.confirm.outcome == 'success' }}
        run: |
          started="$(cat "$RUNNER_TEMP/confirm.start" 2>/dev/null || date +%s)"
          until [ -f "$RUNNER_TEMP/confirm.rc" ] || [ "$(date +%s)" -gt $(( started + 180 + 5 )) ]; do sleep 0.5; done
          cat "$RUNNER_TEMP/confirm.log" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/confirm.rc" ] || echo "confirm_recent still running past its 180 s timeout"
          rc="$(cat "$RUNNER_TEMP/confirm.rc" 2>/dev/null || true)"
          echo "confirm_recent exit code: ${rc:-none yet}"
          if [ "$rc" = "124" ]; then
            .venv/bin/python scripts/confirm_recent.py --killed "$rc" || true
          fi
      - name: The live record, collected (WXPredict WP3)
        # Waits for the run started above, at most until its 105 s backstop
        # has passed, counted from its start. It never fails the job: a
        # failure is in the run's own row (P2.12_live_capture), and a run the
        # backstop ended (exit 124) writes none, so this writes it.
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: |
          started="$(cat "$RUNNER_TEMP/capture.start" 2>/dev/null || date +%s)"
          until [ -f "$RUNNER_TEMP/capture.rc" ] || [ "$(date +%s)" -gt $(( started + 105 + 5 )) ]; do sleep 0.5; done
          cat "$RUNNER_TEMP/capture.log" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/capture.rc" ] || echo "live_capture still running past its 105 s timeout"
          rc="$(cat "$RUNNER_TEMP/capture.rc" 2>/dev/null || true)"
          echo "live_capture exit code: ${rc:-none yet}"
          if [ "$rc" = "124" ]; then
            .venv/bin/python scripts/live_capture.py --killed "$rc" || true
          fi
      # The hourly collector banks checkpoints; the day-ahead hit record also
      # needs fact_band_outcome. Do that after confirmations have finished,
      # outside their 180-second backstop, using the existing immutable bank.
      # A new result requests a durable page refresh without blocking the tick
      # on the refresh queue. No fitting or checkpoint capture happens here.
      - name: Bank newly confirmed settlement ladders
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        timeout-minutes: 2
        run: .venv/bin/python scripts/settlement_followup.py
      # WXPREDICT ON THE DAY, IN SHADOW (13 Oct). wxrd-v2, the remaining-day
      # model that counts a report 8 minutes after its reading (#394), beside
      # every same-day call this tick wrote, all cities, at the engine's own
      # checkpoints: variant 'wxrd' in variant_shadow_checkpoints, one log row
      # (P7.6_wxrd_shadow). After the live record is collected, so this hour's
      # reports are in it, and before the trade prints' collector, which stays
      # last. Its own virtualenv (cached), its own 3 minutes, and it never
      # fails the job. Rehearsed on the 20:36Z tick of 12 Oct against the live
      # tables: 8 checkpoints due, 8 rows, 4.1 s. Nothing here prices or trades.
      # The virtualenv is built beside the cached path and moved into it only
      # once its imports work, so a failed or timed-out install leaves nothing
      # at .venv-wx for the cache to save (Codex on #395).
      - name: The WXPredict virtualenv
        id: wxvenv
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        uses: actions/cache@v4
        with:
          path: .venv-wx
          key: tick-wx-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.wxpredict.txt') }}
      - name: The accepted candidate weights
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && hashFiles('data/models/wxrd/shadow-current.json', 'data/models/wxrd/current-shadow.json') != '' }}
        uses: actions/cache@v4
        with:
          path: .cache/wxpredict-models
          key: wxpredict-model-${{ runner.os }}-${{ hashFiles('data/models/wxrd/shadow-current.json', 'data/models/wxrd/current-shadow.json') }}
      - name: WXPredict on the day, in shadow (wxrd-v2)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if [ ! -x .venv-wx/bin/python ]; then
            rm -rf .venv-wx-build
            python -m venv .venv-wx-build
            .venv-wx-build/bin/python -m pip install -q -r requirements.wxpredict.txt
            .venv-wx-build/bin/python -c "import lightgbm, numpy, pandas, requests, scipy"
            mv .venv-wx-build .venv-wx
          fi
          .venv-wx/bin/python tools/wxpredict/wxrd_live.py
      - name: Trade prints, collected
        # Waits for the run started above: it stops starting batches at its
        # budget and before TICK_DEADLINE, so it has normally finished by now.
        # A batch already in flight is let finish, as when this step ran last;
        # 120 s is the backstop for a hung request, inside the job's 5-minute
        # timeout. Its exit code is the step's: it fails only when nothing
        # worked (ingest_trades.py). Only if the run was started.
        if: ${{ !cancelled() && steps.trades.outcome == 'success' }}
        run: |
          for i in $(seq 1 240); do [ -f "$RUNNER_TEMP/trades.rc" ] && break; sleep 0.5; done
          cat "$RUNNER_TEMP/trades.log" 2>/dev/null || true
          if [ ! -f "$RUNNER_TEMP/trades.rc" ]; then
            echo "trade prints still running after 120 s: the next run resumes from the last log row"
            exit 0
          fi
          exit "$(cat "$RUNNER_TEMP/trades.rc")"
