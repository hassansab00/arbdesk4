name: Live Weather Monitor

# THE SCHEDULE IS GONE ON PURPOSE. This ran every 15 minutes - 2,880 runs and
# ~4,300 minutes a month - and n8n P1.2 now does the same job better: it reads
# api.weather.gov, which is what these markets settle on, and since the series
# change it archives the whole day's readings rather than one. An n8n execution
# for a fetch-and-write costs a fraction of a billed GitHub minute.
#
# Two jobs writing live_weather on different cadences was also the kind of
# duplication that makes "which number is current?" unanswerable.
#
# Kept as a manual run: it is the fallback when n8n is down or not yet imported,
# and the only path that works before P1.2 is activated.
on:
  workflow_dispatch: {}

jobs:
  # TURNED OFF by the WXPredict build, wave A.6 (Hassan, 6 Oct: "do what's
  # necessary as long as nothing's broken"; docs/WXPREDICT_BUILD.md section 3.6).
  # Nothing starts this workflow: not the clock, the web app or n8n.
  # The hourly tick does this job now: tick.yml's NWS monitor step
  # (ingest_nws_monitor) writes live_weather and logs P1.2_nws_monitor (84 runs in the 7 days to
  # 6 Oct 14:36Z). This manual fallback last ran 5 Sep.
  # A dispatch now skips the job and bills nothing. To turn it back on, delete
  # the `if: false` line below (restore_edge_marks: put back
  # `if: github.ref_name == 'main'`).
  live_weather:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt
      - run: PYTHONPATH=scripts python scripts/live_weather.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
