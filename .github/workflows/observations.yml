name: Observations (IEM METAR)

on:
  schedule:
    # Every 6 hours, not every 2. These feed a DAILY maximum and the
    # settlement comparison against NWS, neither of which is finer-grained
    # than a day; three extra runs an hour bought nothing and cost 360
    # minutes a month.
    # EVERY 12 HOURS, NOT EVERY 6. Each run re-fetches the last 2 DAYS, so a
    # 12-hour cadence still covers every hour four times over - the only thing
    # that changes is how soon a METAR reaches the archive, and nothing reads
    # this table for a live number. live_weather comes from n8n's P1.5 every 3
    # hours and P1.2's NWS observations every 2. This is the archive feed, and
    # at ~2 billed minutes a run, 6-hourly was 360 of the month's 2,000
    # minutes. Put it back to '7 */6 * * *' if you ever want it tighter.
    - cron: '7 */12 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to backfill (2 for normal runs, 365+ for archive build)'
        required: false
        default: '2'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_observations.py ${{ github.event.inputs.days || '2' }}
        working-directory: .
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
