name: Observations (IEM METAR)

on:
  schedule:
    # Every 6 hours, not every 2. These feed a DAILY maximum and the
    # settlement comparison against NWS, neither of which is finer-grained
    # than a day; three extra runs an hour bought nothing and cost 360
    # minutes a month.
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to backfill (2 for normal runs, 365+ for archive build)'
        required: false
        default: '2'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_observations.py ${{ github.event.inputs.days || '2' }}
        working-directory: .
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
