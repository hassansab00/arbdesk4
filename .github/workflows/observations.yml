name: Observations (IEM METAR)

# THE CADENCE MOVED TO n8n ON 2026-09-22. This is now the BACKFILL path and a
# daily backstop, not the feed.
#
# WHAT WAS WRONG WITH THE SIX-HOURLY CRON. GitHub delivers a schedule
# best-effort and drops it under load. Measured over the six runs before
# 21 Sep, not one of which failed:
#
#     11:11 -> 15:57   4h46m
#     15:57 -> 20:43   8h01m is not a typo further down
#     20:43 -> 04:44   8h01m
#     04:44 -> 12:39   7h55m
#     12:39 -> (none)  8h24m and counting
#
# v_city_observation_health calls a city timeable only while its newest
# reading is under 90 minutes old, so on this cadence the 37 cities with no
# api.weather.gov feed were timeable for at most a quarter of the day - and
# measured at 23:58 on 21 Sep, 0 of them were.
#
# WHY IT COULD NOT SIMPLY MOVE. n8n/P1.6 was built for exactly this and lost
# most of the board every run, because n8n Cloud shares one egress IP and IEM
# rate-limits it:
#
#     12 concurrent   44 of 48 stations returned nothing
#      4 concurrent   42 of 48
#      1 at a time    34 of 48, in 26 s, because most were rejected before
#                     they were served
#     every failure body: "Too many requests from your IP address, slow down."
#
# SERIALISING DID NOT HELP, and that was the diagnosis nobody drew: a
# concurrency cap is cleared by going one at a time, and this was not, so the
# limiter counts REQUESTS. The fix was never a longer interval - it was to
# stop making 48 of them. The ASOS service accepts repeated station=
# parameters. Measured from the same n8n egress, 2026-09-22:
#
#     P1.6 run 8287, 48 requests   partial: 854 rows, 29 of 48 stations lost
#     P1.6 run 8316, ONE request   ok: 279 rows, 48 of 48 cities, 4.7 s
#
# scripts/ingest_observations.py batches the same way, so this workflow is
# still the path for a long backfill (it chunks by time) and a daily backstop
# across the midnight seam that P1.6's rolling six-hour window does not need.
# Hourly here was never possible anyway: tests/test_github_actions.py caps
# scheduled runs at 430 a month and '0 * * * *' is 720 on its own.
on:
  # NO GITHUB CRON (25 Sep): n8n's "AD4 P6.1 - Clock" dispatches this at 05:36 UTC daily.
  # GitHub's cron started nothing on this repo from 20:04Z on 24 Sep for 12 h;
  # every scheduled workflow is on the CLOCK table in n8n/P6.1_clock.template.json.
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to backfill (2 for normal runs, 365+ for an archive rebuild)'
        required: false
        default: '2'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt
      - run: python scripts/ingest_observations.py ${{ github.event.inputs.days || '2' }}
        working-directory: .
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
