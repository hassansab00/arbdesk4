name: Restore Edge Marks (one-off)

# Plan v2 P1.6 phase 3, step 3.1b. Until 20260929220000 froze them, the edges
# prune took each band's eve and pre-day YES price like any superseded
# pricing, after the archive had exported it to data/archive/edges. This sends
# those files back to restore_edge_marks (sql/ad4_97), which writes each
# band's missing mark into derived_edge_marks and nothing else - never over a
# frozen mark, never where edges still holds it. Manual only: there is no
# schedule, and there never should be.
#
# A dry run unless `mode` is `commit`. A commit run writes, checks every
# restored mark against the files, refreshes the page cache and dry-runs
# again, which must find nothing left to write.
#
# It needs the service key, which lives only in this repo's secrets - which is
# why it is a workflow and not something run from a laptop or a session.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run counts only; commit writes the marks'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'commit']

permissions:
  contents: read

concurrency:
  group: restore-edge-marks
  cancel-in-progress: false

jobs:
  # TURNED OFF by the WXPredict build, wave A.6 (Hassan, 6 Oct: "do what's
  # necessary as long as nothing's broken"; docs/WXPREDICT_BUILD.md section 3.6).
  # Nothing starts this workflow: not the clock, the web app or n8n.
  # A one-off recovery: it ran its two runs on 29 Sep. The cause is fixed - since
  # 20260929220000 the edges prune never takes an eve or pre-day mark before
  # freeze_edge_marks has copied it.
  # A dispatch now skips the job and bills nothing. To turn it back on, delete
  # the `if: false` line below (restore_edge_marks: put back
  # `if: github.ref_name == 'main'`).
  restore:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      - name: Restore the marks from data/archive/edges
        run: |
          if [ "${{ github.event.inputs.mode }}" = "commit" ]; then
            python tools/restore_edge_marks.py run --commit
          else
            python tools/restore_edge_marks.py run
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
