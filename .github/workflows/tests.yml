name: Tests

# WHY THE TRIGGERS ARE NARROW: minutes, and this repo ran out of them.
#
# `on: push` with no branch filter plus `on: pull_request` billed EVERY
# commit two or three times over - once for the push to the feature branch,
# once for the pull request on the same sha, and once again for the push to
# main when the branch was merged. Three identical runs, three times the
# minutes, one piece of information. A private repo meters Actions minutes,
# and at ~100 commits a month that duplication alone was ~600 of the 2,000
# in the free allowance.
#
# Now: a pull request is checked (that is the review gate). A push to a
# feature branch with no PR open is not - run `pytest` locally, which is what
# it is for, or start the run by hand from the Actions tab.
#
# MAIN IS NOT CHECKED AGAIN AFTER A MERGE (Hassan, 5 Oct). The pull request's
# run already tested the branch merged into main, and the squash lands that
# same tree; the push to main ran it a second time. 4 Oct 13:21Z - 5 Oct
# 08:41Z that was 10 of 41 test runs, while October was already over the
# 3,000-minute allowance's pace (890 billed by 5 Oct 09:00Z, CI 379). A push
# straight to main is not tested by itself: start the run from the Actions
# tab. Generated commits from the scheduled jobs carry [skip ci] anyway.
#
# A PULL REQUEST THAT CHANGES ONLY DOCUMENTS NO TEST READS IS NOT RUN
# (WXPredict build, wave A.2; docs/WXPREDICT_BUILD.md section 3.6). In October
# to the 5th, 2 of 53 pull-request runs (10 billed minutes) changed nothing a
# test reads. The list below names only what may be skipped - documents under
# docs/ and markdown at the root - and puts back every document a test opens.
# It is measured, not written by hand: tools/ci_paths.py --write runs the
# suite and records what it opened. tests/conftest.py fails the run if a test
# reads a skipped path; tests/test_ci_paths.py checks the block. GitHub reads
# a pull request's patterns over its whole diff, in order, the last match
# deciding; the suite runs if any changed file is included.
on:
  pull_request:
    paths:
      # BEGIN generated by tools/ci_paths.py --write: do not edit by hand
      - '**'
      - '.github/**'
      - '!*.md'
      - '!docs/**'
      - 'docs/CHALLENGER_C_PREREG.md'
      - 'docs/OPEN_ITEMS.md'
      - 'docs/P11_DA_FLOOR_PREREG.md'
      - 'docs/P11_INTRADAY_DIAGNOSIS_2026-10-04.md'
      - 'docs/P22_PREDICTION_CONTRACT.md'
      - 'docs/S10_MAX_TEMP_WINNER.md'
      - 'docs/SD_CORR_PREREG.md'
      - 'docs/SD_CORR_REPLAY_2026-10-05.md'
      # END generated by tools/ci_paths.py
  workflow_dispatch: {}

# A second push while the first is still running makes the first answer
# worthless. Cancel it rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/database/package-lock.json
      - run: npm ci --prefix tests/database --ignore-scripts
      # BOTH SUITES AT ONCE (plan v2 P6.1, 4 Oct). Run one after the other they
      # took 148 s (pytest) + 105 s (the database contracts) of a 274 s job, the
      # median of the last 20 green runs: five billed minutes, and CI comes out
      # of the same 3,000 a month as the schedule. The runner has two cores
      # and each suite uses one, so they run side by side: on two cores locally
      # the pair took 174 s instead of 156 + 105. Every test still runs. The job
      # fails if either suite fails, and the contracts' log is printed after
      # pytest's so the two do not interleave. First run (PR #302, 4 Oct): the
      # job took 170 s, three billed minutes.
      - name: pytest and the paper database transaction contracts, side by side
        run: |
          set +e
          npm test --prefix tests/database > "$RUNNER_TEMP/contracts.log" 2>&1 &
          contracts=$!
          PYTHONPATH=scripts python -m pytest tests/ -q
          py=$?
          wait "$contracts"
          db=$?
          echo "----- paper database transaction contracts (exit $db) -----"
          cat "$RUNNER_TEMP/contracts.log"
          [ "$db" -eq 0 ] || echo "::error::the paper database transaction contracts failed (exit $db)"
          [ "$py" -eq 0 ] || echo "::error::pytest failed (exit $py)"
          [ "$py" -eq 0 ] && [ "$db" -eq 0 ]
