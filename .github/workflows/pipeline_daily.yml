name: Daily Pipeline (forecasts, settlement, skill, databank, derived)

# ONE RUNNER INSTEAD OF SIX.
#
# These ran as six workflows spread across the small hours - backtest 02:00,
# settlement 04:00, derived recompute 05:00, forecast ingest 05:20, skill
# 06:00, databank 07:30 - and the spacing was a guess that each had finished
# before the next started. Six runs, six checkouts, six pip installs, six
# billed minutes minimum, for work that is one dependency chain.
#
# THE ORDER IS THE POINT, and merging fixed one place it was wrong. capacity.py
# says in its own comment that the calibration feedback "reads the frozen
# evidence databank writes, and this job is what runs after it" - but derived
# recompute fired at 05:00 and databank at 07:30, so it ran two and a half
# hours BEFORE the evidence it was meant to read, measuring against a databank
# a day old. Immaterial to a 30-day statistic, wrong as a design, and free to
# fix once the two are steps in one job. Derived recompute now runs after the
# databank freeze, which is what the code always said it did.
#
# Each step carries `if: !cancelled()` so a failure does not skip the rest -
# that is what the six separate workflows gave you, and losing it would mean
# one bad settlement run silently costing you a day of every downstream table.
# The job still fails, and names the step.

on:
  # NO GITHUB CRON (25 Sep): n8n's "AD4 P6.1 - Clock" dispatches this at 04:36 UTC daily.
  # GitHub's cron started nothing on this repo from 20:04Z on 24 Sep for 12 h;
  # every scheduled workflow is on the CLOCK table in n8n/P6.1_clock.template.json.
  workflow_dispatch:
    inputs:
      databank_days:
        description: 'How many days back to look for settled days'
        required: false
        default: '7'
      skill_days:
        description: 'How many days of history to measure skill over'
        required: false
        default: '400'
      outcome_days:
        description: 'How many recent city-days to check for final authority evidence'
        required: false
        default: '14'

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

env:
  PYTHONPATH: scripts
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      # 1. Yesterday's Open-Meteo runs, so skill has something to score.
      #    A BACKFILL over a date range is not this - it is forecasts.yml,
      #    which stays a manual workflow because it can run for hours.
      - name: Ingest forecasts (last 10 days)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: python scripts/ingest_forecasts.py

      # 2. Capture the exact final station evidence named in each market's
      #    saved rules. No estimate or running maximum may cross this gate.
      - name: Authoritative weather outcome evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python scripts/weather_outcomes.py --days ${{ github.event.inputs.outcome_days || '14' }}

      # 3. Capture final venue truth. Gamma and CLOB must agree on condition,
      #    token identities and winner. This also settles matching paper
      #    positions, but collects evidence even when no position existed.
      # The budget is passed explicitly because the script's own defaults are
      # sized for the intraday chain, where this step shares a runner with
      # five others and must not hold it. Here it has the job almost to
      # itself. Until 15 Sep the sweep captured nothing at all (Gamma omits a
      # settled market unless the request says so), so 60 seconds looked
      # sufficient; the first run that worked captured 47 proofs in that
      # minute and left 14,165 candidates unreached. A market is only
      # confirmed once every one of its 220-560 bands is proved, which at 47
      # a run is never. Fifteen minutes inside a twenty-minute timeout walks
      # roughly 700 a run instead, and the walk remembers what it captured.
      - name: Venue-confirmed settlement sweep
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python scripts/paper_settlement.py --budget-seconds 900 --max-evidence 2000

      # 4. Measure forecast skill only against final station-authority
      #    evidence. Until that evidence exists, this writes nothing rather
      #    than training sigma on an incomplete running maximum.
      - name: Measure forecast skill
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: python scripts/measure_skill.py ${{ github.event.inputs.skill_days || '400' }}

      # 4b. Judge the desk's OWN model against the public forecast on forward
      #     days. Beating persistence on held-out days of its own training
      #     window is not the test a price has to pass; this is, and until a
      #     city and lead pass it the model stays in shadow and cannot move a
      #     number. Seconds of work on a few thousand rows, so it rides in the
      #     daily job rather than paying for a schedule of its own.
      - name: Promote or shadow the fitted models
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python scripts/model_promotion.py

      # 4c. The early record (plan v2 P4.4): a band banked before 13 Sep is
      #     read by the learners only with the venue's confirmed answer. On
      #     24 Sep 2,027 early bands had one and 3,578 were still unverified
      #     or partial; the sweep above can still prove them, so the answers
      #     it confirms are added here, before databank freezes signal
      #     outcomes from the clean record. Idempotent; adds, never rewrites.
      - name: Rebuild the early record from the venue
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python - <<'PY'
          from common import rpc
          print("early bands rebuilt from the venue:", rpc("rebuild_early_band_outcomes"))
          PY

      # 5. Freeze the desk's own record - what it predicted, what the market
      #    said, what happened. These rows are never updated: a maximum frozen
      #    too early is wrong forever, which is why it waits for settlement.
      - name: Freeze settled city-days
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: python scripts/databank.py --days ${{ github.event.inputs.databank_days || '7' }}

      # 6. Re-fit the calibration map on everything banked. Refuses to write a
      #    map below its minimum sample count, so it is safe from day one.
      - name: Re-fit calibration map
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: python scripts/calibration.py

      # 6a. The nightly learning loop (plan v2 P5.8): the belief maps, from the
      #     checkpoint outcomes databank banked above, one immutable row per
      #     version in strategy_params. Recorded every night, used only once
      #     settings.strategy_learning.enabled is on (after the replay, P7.3).
      #     Seconds of arithmetic on a few thousand buckets.
      - name: Learn strategy parameters
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python scripts/strategy_learn.py

      # 6b. Fit the distributional post-processing: per city and lead, the
      #     station bias to subtract and the factor the published width was
      #     missing. Reads fact_forecast_outcome, so it goes AFTER the databank
      #     freeze, and it reads only station-authority rows - fitting on the
      #     pre-repair reader would teach it that reader's over- and under-read.
      #     A cross-validated fit over ~400 cells and a 25-point shrinkage grid
      #     is seconds of arithmetic on a few thousand rows, so it rides here
      #     rather than paying for a schedule of its own.
      - name: Fit forecast post-processing
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python scripts/forecast_postprocess.py

      # 6c. Fit the intraday trajectory layer: per city and local hour, does
      #     pricing the rest of the day from its own climb beat the FLOORED
      #     forecast? After the databank freeze and after 6b, because it is
      #     scored against the distribution the desk actually published.
      #     Seconds of arithmetic over a few thousand city-day-hours.
      - name: Fit the intraday trajectory
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python scripts/trajectory.py

      # 7. Capacity, correlation, peak hour, climate cache, the day-feature
      #    cache - and the calibration FEEDBACK, which measures whether the
      #    sigma the desk quoted turned out honest. After the databank freeze,
      #    which is the ordering the old schedule had backwards.
      - name: Derived recompute
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: python scripts/capacity.py

      # 7a. Plan v2.2 P3.9: each forecast model's error at the settlement
      #      station, learned per city and lead, and the corrected equal-weight
      #      combination for the open days. AFTER the derived recompute (7):
      #      its truth is derived_city_day_features, and until 7 runs the row
      #      for yesterday is the part of the day seen at 05Z the day before -
      #      measured 26 Sep, 4.1 C short on average across 35 cities. The
      #      script also reads only rows computed after their local day ended.
      #      The engine prices from it only while
      #      settings.station_correction_pricing is on. Scores itself
      #      walk-forward every night (logged). Seconds of arithmetic.
      - name: Fit the station correction per forecast model
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python scripts/station_correction.py

      # 7a2. Plan v2.2 P2.9: the honest station model (after 7 and 7a, for
      #      the same reason: its labels and the last station maximum a
      #      forward row starts from must be whole days) - learned only from what
      #      the forecasts said beforehand (data/training/previous_runs, which
      #      archive_observations.yml extends nightly) - and its blend with the
      #      P3.9 combination above, for the open days. Scores itself on the
      #      last 30 days with a fit that ended before them (logged). Shadow
      #      until settings.station_mos_pricing is on. Measured locally 26 Sep:
      #      a fit 3.4 s, the held-out check 4.8 s, per lead; plus 96 requests
      #      for the current runs.
      - name: The honest station model
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python scripts/station_mos.py

      # 7b. How right each city's thermometer has been, copied onto cities so
      #     both engines can read it. AFTER "Freeze settled city-days", because
      #     v_settlement_agreement judges against ladders that have settled -
      #     running it earlier measures yesterday.
      - name: Refresh observation trust
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python - <<'PY'
          from common import rpc
          out = rpc("refresh_observation_trust")
          print("observation trust:", out)
          PY

      # 7c. The hit tournament (plan v2.1 P3.8): per city, every pricing recipe
      #     scored FORWARD on the bucket that settled, against the live engine
      #     and the market at 18:00 local the evening before. After the databank
      #     freeze (its evidence) and 7b (the per-city measurement layer).
      #     Shadow: it writes derived_hit_*, the engine does not read them yet.
      - name: The hit tournament
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: python scripts/hit_tournament.py

      # 7d. Strategy lifecycle (plan v2 P5.2): suspend a shadow strategy whose
      #     own ledger's record says it loses beyond its noise (>= 40 settled
      #     decisions, upper 90% bound of mean log-growth < 0), and put one
      #     suspended for 14 days back in shadow for a re-test. After the
      #     settlement sweep, so tonight's closed trades count.
      - name: Strategy lifecycle
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python scripts/strategy_lifecycle.py

      # 7e. The meta-allocator (plan v2 P5.10): promote a shadow strategy
      #     whose own ledger passes the evidence gate, activate the portfolio
      #     account the first time one does, and write tonight's Thompson
      #     allocation. After the lifecycle, so a strategy suspended tonight
      #     is already out of the portfolio.
      - name: Meta-allocator
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python scripts/meta_allocator.py

      # 8. Safety net: run anything left queued in backtest_runs. Usually a
      #    no-op. An explicit backtest is backtest.yml, run by hand.
      - name: Queued backtests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        # The runner stops itself four minutes before this axe falls and
        # records why. A process killed here cannot update its own row, which
        # is how run 5f7bc321 spent a day claiming to be running.
        env:
          BACKTEST_BUDGET_MINUTES: '26'
        run: python scripts/backtest/runner.py

      # THE PAGES READ STORED ROWS (plan v2 P6.5): refresh them now that this
      # run has written, rather than at the next :12 / :42 of pg_cron.
      # CONCURRENTLY, so a page open during the refresh keeps reading.
      - name: Refresh the stored page rows
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from common import rpc
          print("page cache refreshed (ms):", rpc("refresh_page_cache"))
          PY
