name: Paper Trade Log

# Closed paper trades become a file in the repository; open ones stay in
# Postgres. web/public/paper-trades/YYYY-MM.jsonl is both the permanent record
# and the data the platform's paper desk page fetches - one file, no build step
# to copy it, nothing that can drift between the archive and the display.
#
# A closed trade never changes again, so this is append-shaped: a day's run
# adds lines and touches nothing above them. `git log web/public/paper-trades`
# is the whole trading history, one commit per day.
#
# DAILY, NOT PER CYCLE. A commit to main is a Vercel deploy, and six a day
# would be six deploys to publish a handful of rows. Trades close when their
# market resolves, which is a daily event on a daily temperature band.
#
# [skip ci] on the commit keeps tests.yml and web.yml - both push-triggered -
# from re-running on a generated data file. Vercel deploys from its own git
# integration and is unaffected, which is the point: the page updates, the CI
# minutes are not spent.
#
# PRUNING IS OPT-IN AND SEPARATELY GUARDED. --prune-days re-reads the files it
# just wrote and passes those ids to prune_exported_paper_trades, which deletes
# only the intersection of that list and its own cutoff. A file that failed to
# write cannot become a delete. 30 days is deliberate: the page reads open
# positions and recent closes live from Postgres and everything older from the
# repo, so the tail has to outlive the gap between runs by a wide margin.
on:
  schedule:
    - cron: '30 5 * * *'          # after pipeline_daily's 04:00 settlement sweep
  workflow_dispatch:
    inputs:
      prune_days:
        description: 'Also delete Postgres rows closed longer ago than this (blank = keep everything)'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: paper-trade-log
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: 'requirements.runtime.txt' }
      - run: pip install -r requirements.runtime.txt

      - name: Export closed trades
        run: |
          PYTHONPATH=scripts python scripts/export_paper_trades.py \
            --prune-days ${{ github.event.inputs.prune_days || '30' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit the log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/paper-trades
          if git diff --staged --quiet; then
            echo "no closed trades to add"
            exit 0
          fi
          # What actually changed, in the commit subject, so the history reads
          # as a trading log rather than as "update data".
          SUMMARY=$(python - <<'PY'
          import json, pathlib
          p = pathlib.Path("web/public/paper-trades/index.json")
          d = json.loads(p.read_text())
          print(f"{d['trades']} closed, net ${d['net_pnl']:.2f}, {d['wins']}W/{d['losses']}L")
          PY
          )
          git commit -m "Paper trade log: $SUMMARY [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:${{ github.ref_name }} && break
            echo "push failed, retrying"; sleep $((2 ** i))
            git pull --rebase origin ${{ github.ref_name }}
          done
